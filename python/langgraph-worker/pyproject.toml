[project]
name = "puerflow-langgraph-worker"
version = "0.1.0"
description = "PuerFlow LangGraph strategy worker (gRPC)."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
puerflow-worker = "puerflow_worker.server:main"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["puerflow_worker*"]

[tool.pytest.ini_options]
pythonpath = [".", "puerflow_worker/grpc_gen"]
testpaths = ["tests"]
asyncio_mode = "auto"
